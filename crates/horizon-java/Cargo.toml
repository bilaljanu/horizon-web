[package]
name = "horizon-java"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fabric and NeoForge mod support for Horizon: JAR metadata, compatibility checks, and a portable Minecraft-facing JVM"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
log = "0.4"

[dev-dependencies]
# The WASM probe checks that Java registrations reach Horizon's real content
# pipeline (declarations, files, creative tab), not just the recording host.
horizon-mods = { path = "../horizon-mods" }
horizon-os = { path = "../horizon-os" }

[lints]
workspace = true
